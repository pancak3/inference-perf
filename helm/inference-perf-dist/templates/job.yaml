{{- if .Values.runAsJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inference-perf-dist.fullname" . }}-job
  labels:
    {{- include "inference-perf-dist.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit | default 0 }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | default 300 }}
  {{- if and (.Values.job.indexed) (gt (.Values.replicaCount | int) 1) }}
  completionMode: Indexed
  completions: {{ .Values.replicaCount }}
  parallelism: {{ .Values.job.parallelism | default .Values.replicaCount }}
  {{- else if gt (.Values.replicaCount | int) 1 }}
  completions: {{ .Values.resplicaCount }}
  parallelism: {{ .Values.job.parallelism | default .Values.replicaCount }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "inference-perf-dist.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "inference-perf-dist.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -n "${JOB_COMPLETION_INDEX:-}" ]; then IDX=${JOB_COMPLETION_INDEX}; else IDX=0; fi
              CONFIG_FILE="/app/config/config-${IDX}.yml"
              echo "Using CONFIG_FILE=${CONFIG_FILE}" >&2
              touch /tmp/ready
              python inference_perf/main.py --config_file ${CONFIG_FILE}
              touch /tmp/finished
              echo "Workload finished index ${IDX}; exiting successfully"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GEO_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}