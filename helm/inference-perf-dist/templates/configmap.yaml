apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
{{- $startTime := now | unixEpoch }}
{{- range $i, $e := until (int .Values.replicaCount) }}
  config-{{ $i }}.yml: |
    data:
      type: geo_dist
      geo_id: {{ add $i 1 }}
      path: /data/user_ts_zone_hotspot_combined_zone_{{ add $i 1 }}.parquet
      start_timestamp: {{ $startTime }}
      first_record_timestamp: {{ $.Values.dataset.first_record_timestamp }}
      delay_start_seconds: {{ $.Values.dataset.delay_start_seconds }}
    storage:
      local_storage:
        path: "/reports"
        report_file_prefix: geo_id-{{ add $i 1 }}-
    load:
      type: constant
      stages:
      - rate: 1
        duration: 5
    api:
      type: chat
      streaming: true
    server:
      type: vllm
      model_name: {{ $.Values.server.model_name }}
      base_url: {{ $.Values.server.base_url }}
      ignore_eos: true
    metrics:
      type: default
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false
      prometheus:
        summary: true
        per_stage: false

{{- end }}
